# Nombre del workflow (aparecerá en la pestaña "Actions")
name: Build y Push a Docker Hub

# 1. El Disparador (Trigger)
on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*.*.*'

# 2. Los Trabajos (Jobs)
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # --- INICIO DE LA CLAVE MULTI-ARQUITECTURA ---
      
      # Paso 1: Configurar QEMU (Emulador de arquitectura)
      # Esto permite que la máquina AMD64 de GitHub construya binarios ARM64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      # --- FIN DE LA CLAVE MULTI-ARQUITECTURA ---

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extraer metadatos de Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: mrcaringi/yt2s3
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Paso 4: Configurar el builder de Docker (ahora con soporte multi-plataforma)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Paso 5: Construir la imagen y subirla (push)
      - name: Build y Push de la imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # ¡NUEVO!: Lista de arquitecturas a construir.
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}