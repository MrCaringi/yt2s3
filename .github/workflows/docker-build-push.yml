# Nombre del workflow (aparecerá en la pestaña "Actions")
name: Build y Push a Docker Hub

# 1. El Disparador (Trigger)
# Se ejecuta en pushes al branch 'main' Y en pushes de tags (releases)
on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*.*.*' # Patrón para tags como v1.0.0

# 2. Los Trabajos (Jobs)
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- INICIO DE LA CLAVE: EXTRACCIÓN DE METADATOS Y TAGS ---
      - name: Extraer metadatos de Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: mrcaringi/yt2s3 # ¡IMPORTANTE! Reemplaza con tu repositorio
          tags: |
            # Opción A: Tag 'latest'
            # Se aplica solo si el push fue al branch 'main'.
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            
            # Opción B: Tags Semánticos (vX.Y.Z)
            # Se aplica solo si el evento es un 'tag' (ej. v1.0.0).
            # Genera múltiples tags: v1.0.0, v1.0, v1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # --- FIN DE LA CLAVE ---

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y Push de la imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }} # Usa los tags generados
          labels: ${{ steps.meta.outputs.labels }}