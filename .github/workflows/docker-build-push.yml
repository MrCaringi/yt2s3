name: Build y Push a Docker Hub

on:
  push:
    tags:
      - 'v*.*.*'  # Solo se ejecuta si el push incluye un tag semántico

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Detectar rama base del tag
        id: branch
        run: |
          BRANCH=$(git branch -r --contains ${{ github.sha }} | grep origin/ | sed 's|origin/||' | head -n 1)
          echo "TAG_BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Extraer nombre del tag
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Extraer metadatos de Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: mrcaringi/yt2s3
          tags: |
            type=raw,value=latest,enable=${{ env.TAG_BRANCH == 'main' }}
            type=raw,value=testing-${{ env.TAG_NAME }},enable=${{ env.TAG_BRANCH == 'testing' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y Push de la imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ env.TAG_NAME }}
            DOCKER_REPO_URL=https://hub.docker.com/r/mrcaringi/yt2s3/tags

      - name: Extract changelog for release notes
        id: changelog
        run: |
          # Extract the changelog section for this version from README.md
          # Format: "- Version X.Y.Z — YYYY-MM-DD" to the next "- Version" line
          VERSION="${{ env.TAG_NAME }}"
          CHANGELOG=$(sed -n "/^- Version ${VERSION#v}/,/^- Version /p" README.md | head -n -1)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Release ${{ env.TAG_NAME }}"
          fi
          # Store in output, handling multiline content
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: ${{ env.TAG_BRANCH == 'testing' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
