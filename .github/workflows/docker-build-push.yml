# Nombre del workflow (aparecerá en la pestaña "Actions")
name: Build y Push a Docker Hub

# 1. El Disparador (Trigger)
# Se ejecuta en pushes a 'main' Y en pushes de 'tags' que empiecen con 'v'
on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*.*.*' # Patrón para tags como v1.0.0
      - 'v*.*'   # Patrón para tags como v1.0

# 2. Los Trabajos (Jobs)
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- INICIO DE LA MODIFICACIÓN ---

      - name: Extraer metadatos de Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: mrcaringi/yt2s3 # Tu imagen
          tags: |
            # Si es un push a 'main', taguea como 'latest'
            type=ref,event=branch,ref=main,suffix=latest
            
            # Si es un tag semántico (ej. v1.0.0), crea automáticamente:
            # - v1.0.0
            # - v1.0
            # - v1
            type=semver,pattern={{version}}
            
            # (Opcional) Si quieres que el tag más nuevo sea también 'latest'
            # Descomenta la siguiente línea:
            # type=semver,pattern={{version}},value=latest

      # --- FIN DE LA MODIFICACIÓN ---

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y Push de la imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }} # Usa los tags generados
          labels: ${{ steps.meta.outputs.labels }}
